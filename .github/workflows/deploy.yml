name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dev dependencies
        working-directory: web
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check
        working-directory: web
        run: ruff check .

      - name: pytest
        working-directory: web
        env:
          DJANGO_SECRET_KEY: ci-only-test-secret
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "*"
          DATABASE_URL: "sqlite:///ci.sqlite3"
        run: pytest -q

  deploy:
    name: Deploy to production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_SSH_IP }}
          username: ${{ secrets.HETZNER_SSH_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /opt/aiproof
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            echo "=== Rebuilding Docker images ==="
            docker compose build
            echo "=== Restarting services ==="
            docker compose up -d --force-recreate --remove-orphans
            echo "=== Validating data ==="
            docker exec aiproof-api python manage.py validate_data || echo "validate_data warned (continuing)"
            echo "=== Cleaning up old images ==="
            docker image prune -f
            echo "=== Deployment successful ==="
