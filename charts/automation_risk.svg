<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 600; fill: #111; }
    .subtitle { font-size: 12px; fill: #666; }
    .label { font-size: 13px; fill: #222; }
    .value { font-size: 13px; font-weight: 600; fill: #111; }
    .axis { font-size: 11px; fill: #888; }
    .grid { stroke: #eee; stroke-width: 1; }
  </style>
  <rect width="820" height="400" fill="#fff"/>
  <text x="20" y="28" class="title">AI Automation Risk (0–10), 2026–2030</text>
  <text x="20" y="46" class="subtitle">Higher bar = more of the role's work is replaceable by AI tools. Computed as 10 − automation resistance.</text>

  <g>
    <line x1="220" y1="70" x2="220" y2="370" class="grid"/>
    <line x1="350" y1="70" x2="350" y2="370" class="grid"/>
    <line x1="480" y1="70" x2="480" y2="370" class="grid"/>
    <line x1="610" y1="70" x2="610" y2="370" class="grid"/>
    <line x1="740" y1="70" x2="740" y2="370" class="grid"/>
    <text x="220" y="385" text-anchor="middle" class="axis">0</text>
    <text x="350" y="385" text-anchor="middle" class="axis">2.5</text>
    <text x="480" y="385" text-anchor="middle" class="axis">5</text>
    <text x="610" y="385" text-anchor="middle" class="axis">7.5</text>
    <text x="740" y="385" text-anchor="middle" class="axis">10</text>
  </g>

  <!-- 52 px per unit. risk = 10 - resist -->
  <!-- AI/ML: resist 10 -> risk 0 -->
  <text x="210" y="96" text-anchor="end" class="label">AI/ML Engineer</text>
  <rect x="220" y="80" width="0" height="22" fill="#16a34a"/>
  <text x="227" y="96" class="value">0</text>

  <!-- DevOps: resist 9 -> risk 1 -->
  <text x="210" y="136" text-anchor="end" class="label">DevOps / Platform</text>
  <rect x="220" y="120" width="52" height="22" fill="#22c55e"/>
  <text x="279" y="136" class="value">1</text>

  <!-- Backend: resist 7 -> risk 3 -->
  <text x="210" y="176" text-anchor="end" class="label">Backend Engineer</text>
  <rect x="220" y="160" width="156" height="22" fill="#84cc16"/>
  <text x="383" y="176" class="value">3</text>

  <!-- Mobile: resist 6 -> risk 4 -->
  <text x="210" y="216" text-anchor="end" class="label">Mobile Developer</text>
  <rect x="220" y="200" width="208" height="22" fill="#eab308"/>
  <text x="435" y="216" class="value">4</text>

  <!-- Frontend: resist 4 -> risk 6 -->
  <text x="210" y="256" text-anchor="end" class="label">Frontend Engineer</text>
  <rect x="220" y="240" width="312" height="22" fill="#f97316"/>
  <text x="539" y="256" class="value">6</text>

  <!-- QA: resist 3 -> risk 7 -->
  <text x="210" y="296" text-anchor="end" class="label">QA Engineer</text>
  <rect x="220" y="280" width="364" height="22" fill="#dc2626"/>
  <text x="591" y="296" class="value">7</text>
</svg>
