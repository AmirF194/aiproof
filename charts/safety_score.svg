<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 18px; font-weight: 600; fill: #111; }
    .subtitle { font-size: 12px; fill: #666; }
    .label { font-size: 13px; fill: #222; }
    .value { font-size: 13px; font-weight: 600; fill: #111; }
    .axis { font-size: 11px; fill: #888; }
    .grid { stroke: #eee; stroke-width: 1; }
  </style>
  <rect width="820" height="400" fill="#fff"/>
  <text x="20" y="28" class="title">Career Safety Score (0–100), 2026–2035</text>
  <text x="20" y="46" class="subtitle">Higher = more durable. Weighted from demand, automation resistance, salary, moat, cyclical stability.</text>

  <!-- gridlines at 0,25,50,75,100 -->
  <g>
    <line x1="220" y1="70" x2="220" y2="370" class="grid"/>
    <line x1="350" y1="70" x2="350" y2="370" class="grid"/>
    <line x1="480" y1="70" x2="480" y2="370" class="grid"/>
    <line x1="610" y1="70" x2="610" y2="370" class="grid"/>
    <line x1="740" y1="70" x2="740" y2="370" class="grid"/>
    <text x="220" y="385" text-anchor="middle" class="axis">0</text>
    <text x="350" y="385" text-anchor="middle" class="axis">25</text>
    <text x="480" y="385" text-anchor="middle" class="axis">50</text>
    <text x="610" y="385" text-anchor="middle" class="axis">75</text>
    <text x="740" y="385" text-anchor="middle" class="axis">100</text>
  </g>

  <!-- bars: x=220 is 0, x=740 is 100, scale = 5.2 px/point -->
  <!-- AI/ML Engineer: 91 -->
  <text x="210" y="96" text-anchor="end" class="label">AI/ML Engineer</text>
  <rect x="220" y="80" width="473.2" height="22" fill="#16a34a"/>
  <text x="700" y="96" class="value">91</text>

  <!-- DevOps / Platform: 84 -->
  <text x="210" y="136" text-anchor="end" class="label">DevOps / Platform</text>
  <rect x="220" y="120" width="436.8" height="22" fill="#22c55e"/>
  <text x="664" y="136" class="value">84</text>

  <!-- Backend Engineer: 76 -->
  <text x="210" y="176" text-anchor="end" class="label">Backend Engineer</text>
  <rect x="220" y="160" width="395.2" height="22" fill="#84cc16"/>
  <text x="623" y="176" class="value">76</text>

  <!-- Mobile Developer: 64 -->
  <text x="210" y="216" text-anchor="end" class="label">Mobile Developer</text>
  <rect x="220" y="200" width="332.8" height="22" fill="#eab308"/>
  <text x="560" y="216" class="value">64</text>

  <!-- Frontend Engineer: 58 -->
  <text x="210" y="256" text-anchor="end" class="label">Frontend Engineer</text>
  <rect x="220" y="240" width="301.6" height="22" fill="#f97316"/>
  <text x="529" y="256" class="value">58</text>

  <!-- QA Engineer: 42 -->
  <text x="210" y="296" text-anchor="end" class="label">QA Engineer</text>
  <rect x="220" y="280" width="218.4" height="22" fill="#dc2626"/>
  <text x="446" y="296" class="value">42</text>
</svg>
