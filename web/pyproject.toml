[project]
name = "aiproof"
version = "0.1.0"
description = "AI-proof: which tech roles survive the 2026-2035 AI shake-out"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "psycopg[binary]>=3.3",
    "gunicorn>=26.0",
    "whitenoise>=6.12",
    "django-environ>=0.14",
    "markdown>=3.10",
    "pymdown-extensions>=11.0",
    "Pygments>=2.20",
    "celery>=5.6",
    "redis>=8.0",
    "django-celery-beat>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.14",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in arg defaults (Django uses this everywhere)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aiproof.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --tb=short"
