[project]
name = "aiproof"
version = "0.1.0"
description = "AI-proof: which tech roles survive the 2026-2035 AI shake-out"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "django-environ>=0.11",
    "markdown>=3.7",
    "pymdown-extensions>=10.12",
    "Pygments>=2.18",
    "celery>=5.4",
    "redis>=5.2",
    "django-celery-beat>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in arg defaults (Django uses this everywhere)
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aiproof.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --tb=short"
